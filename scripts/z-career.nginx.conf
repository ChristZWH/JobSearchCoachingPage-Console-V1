# ============================================================
# Z-Career 站点配置（模板，__DOMAIN__ / __CONSOLE_DOMAIN__ 由 scripts/setup-nginx.sh 替换）
#
#   主站（Next.js，Docker 容器 :3000）              -> __DOMAIN__ / www.__DOMAIN__
#   控制台（Vite 静态文件 /srv/z-career/console/current）-> __CONSOLE_DOMAIN__
#   Go 后端（systemd，:8080）                       -> 控制台的 /api、/uploads 反代到这里
#
# 注意：
#   - 主站所有请求都原样交给 Next.js 容器，不要在这里代理 /api ——
#     主站有自己的 Next.js API 路由（/api/contact、/api/cases 等），
#     容器内部通过 GO_API_BASE_URL 在服务端直连 Go 后端
#   - 控制台与开发代理行为一致：/api、/uploads 反代到 Go 后端 :8080
#   - HTTPS 后续用 certbot 补，本配置先跑 HTTP
# ============================================================

# ---------- 主站 ----------
server {
    listen 80 default_server;      # 默认站点：直接用 IP 访问也显示主站
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级头：Next.js 开发模式 HMR 需要，生产保留无害
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ---------- 控制台 ----------
server {
    listen 80;
    listen [::]:80;
    server_name __CONSOLE_DOMAIN__;

    root /srv/z-career/console/current;
    index index.html;

    client_max_body_size 20m;

    # 带 hash 的构建产物长缓存（文件名变了 URL 就变，可放心 immutable）
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 反代到 Go 后端（与控制台开发代理行为一致）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（头像/logo 等）同样反代到 Go 后端
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：深层链接（如 /dashboard）全部回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
